# Eternal Launcher HTTP file server.
# This configuration doesn't rely on NGINX-only features and can be adapted to
# another HTTP server without changing the launcher's contracts.
server {
    listen 80;
    listen [::]:80;

    server_name 10.0.0.13 eternal-launcher.local fastdl.aplot.cloud eternalfast.aplot.cloud;
    root /srv/eternal-launcher/files;

    charset utf-8;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    default_type application/octet-stream;

    access_log /var/log/nginx/eternal-launcher.access.log;
    error_log /var/log/nginx/eternal-launcher.error.log;

    # The manifest must never be cached, since it decides whether the launcher
    # needs to download new or updated files.
    location = /manifest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Published last, by atomic SFTP rename, after the executable has been verified.
    location = /launcher/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Incomplete uploads are never offered as releases.
    location ~ ^/launcher/.*\.(upload|tmp)$ {
        deny all;
    }

    # Other files can be listed and downloaded, but never uploaded through the
    # HTTP endpoint. Publishing happens separately over SFTP.
    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Prevent hidden files from being exposed by accident.
    location ~ (^|/)\. {
        deny all;
    }
}
