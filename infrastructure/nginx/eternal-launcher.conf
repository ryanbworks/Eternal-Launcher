# Servidor HTTP de arquivos do Eternal Launcher.
# Esta configuração não depende de recursos exclusivos do NGINX e poderá ser
# adaptada para outro servidor HTTP sem alterar os contratos do launcher.
server {
    listen 80;
    listen [::]:80;

    server_name 10.0.0.51 eternal-launcher.local fastdl.aplot.cloud eternalfast.aplot.cloud;
    root /srv/eternal-launcher/files;

    charset utf-8;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    default_type application/octet-stream;

    access_log /var/log/nginx/eternal-launcher.access.log;
    error_log /var/log/nginx/eternal-launcher.error.log;

    # O manifesto não deve permanecer em cache, pois futuramente determinará
    # se o launcher precisa baixar arquivos novos ou atualizados.
    location = /manifest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Published last, by atomic SFTP rename, after the executable has been verified.
    location = /launcher/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Incomplete uploads are never offered as releases.
    location ~ ^/launcher/.*\.(upload|tmp)$ {
        deny all;
    }

    # Os demais arquivos podem ser listados e baixados, mas nunca enviados
    # pelo endpoint HTTP. A publicação é realizada separadamente por SFTP.
    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Impede que arquivos ocultos sejam expostos acidentalmente.
    location ~ (^|/)\. {
        deny all;
    }
}
