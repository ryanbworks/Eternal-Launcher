name: Publish launcher
run-name: Eternal ${{ inputs.version }}-${{ inputs.codename }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version (for example 1.0.15)
        required: true
        type: string
      codename:
        description: Version name (letters and digits only, no accents)
        required: true
        default: Aura
        type: string
      check_only:
        description: Build and check access only, without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eternal-production-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate version and name
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODENAME: ${{ inputs.codename }}
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            Write-Output "::error title=Invalid version::Use the format 1.0.15 (received: '$env:RELEASE_VERSION')."
            exit 1
          }
          if ($env:RELEASE_CODENAME -cnotmatch '^[A-Za-z0-9]{1,40}$') {
            Write-Output "::error title=Invalid name::Use 1 to 40 letters or digits, without accents or spaces (received: '$env:RELEASE_CODENAME')."
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test without the production key
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODENAME: ${{ inputs.codename }}
        run: |
          ./tests/TestCiSigning.ps1
          ./tools/BuildCiRelease.ps1 -Version $env:RELEASE_VERSION -Codename $env:RELEASE_CODENAME
      - name: Sign the package with the existing key
        shell: pwsh
        env:
          ETERNAL_SIGNING_KEY_PKCS8: ${{ secrets.ETERNAL_SIGNING_KEY_PKCS8 }}
        run: ./tools/Release.ps1 -SkipBuild -BuildDirectory out/build/ci -CiSigningKey
      - name: Verify the signed package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./tools/VerifyRelease.ps1 -PackageDirectory "out/releases/$env:RELEASE_VERSION" -ExpectedVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-package
          path: out/releases/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 30
      - name: Keep test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: out/build/ci/Testing/Temporary/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-package
          path: out/package
      - name: Install the publishing client
        run: python3 -m pip install -r tools/ci-requirements.txt
      - name: Run publisher tests
        run: python3 -m unittest discover -s tests -p test_publish_release.py -v
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:eternal-ci
          args: --accept-dns=false
      - name: Publish over SFTP on the local network
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          args=()
          if [ "$CHECK_ONLY" = "true" ]; then args+=(--check-only); fi
          python3 tools/publish_release.py --package out/package "${args[@]}"
      - name: Record the result
        if: success()
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODENAME: ${{ inputs.codename }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          printf 'Version: **%s-%s**\n\nCheck only: **%s**\n' "$RELEASE_VERSION" "$RELEASE_CODENAME" "$CHECK_ONLY" >> "$GITHUB_STEP_SUMMARY"
